name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The build reads committed vendor/ files, so no dependency install is needed.
      - name: Build the client artifact
        run: node build.mjs

      - name: Artifact must be reproducible
        run: git diff --exit-code -- client.js

      - name: Syntax check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Package contents
        run: npm pack --dry-run
