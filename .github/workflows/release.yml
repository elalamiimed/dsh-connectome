name: Release

# Publish on a version tag, e.g. `git tag v1.0.1 && git push origin v1.0.1`.
# Requires an `NPM_TOKEN` repository secret (npm automation token with publish
# rights for the `dsh-connectome` package). The tag must match package.json.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "
            const pkg = require('./package.json');
            const tag = process.env.TAG.replace(/^v/, '');
            if (tag !== pkg.version) {
              console.error('tag ' + process.env.TAG + ' does not match package version ' + pkg.version);
              process.exit(1);
            }
            console.log('releasing ' + pkg.name + '@' + pkg.version);
          "

      - name: Build and verify
        run: |
          node build.mjs
          git diff --exit-code -- client.js
          npm run check
          npm test

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
