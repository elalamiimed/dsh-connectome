<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="cnx-title cnx-desc">
  <title id="cnx-title">Connectome — a living map of a workspace's files and imports</title>
  <desc id="cnx-desc">Illustration of a force-directed graph: blue neurons are files, grey arrows are imports, dashed links are documentation references. This is artwork, not a screenshot.</desc>
  <defs>
    <radialGradient id="cnx-bg" cx="72%" cy="42%" r="72%">
      <stop offset="0" stop-color="#1E293B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="cnx-title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <marker id="cnx-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#94A3B8"/>
    </marker>
    <filter id="cnx-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#cnx-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#334155"/>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="80" y="104" font-size="46" font-weight="700" letter-spacing="-1" fill="url(#cnx-title)">Connectome</text>
    <text x="80" y="142" font-size="19" fill="#CBD5E1">A living map of your workspace — every file a neuron, every import a synapse.</text>

    <g stroke="#94A3B8" fill="none" stroke-linecap="round">
      <path d="M760 360 640 300" stroke-width="2" marker-end="url(#cnx-arrow)"/>
      <path d="M760 360 660 430" stroke-width="2" marker-end="url(#cnx-arrow)"/>
      <path d="M760 360 850 270" stroke-width="2" marker-end="url(#cnx-arrow)"/>
      <path d="M760 360 880 370" stroke-width="2.4" marker-end="url(#cnx-arrow)"/>
      <path d="M760 360 830 470" stroke-width="2" marker-end="url(#cnx-arrow)"/>
      <path d="M760 360 980 330" stroke-width="2" marker-end="url(#cnx-arrow)"/>
      <path d="M760 360 760 220" stroke-width="2" marker-end="url(#cnx-arrow)"/>
      <path d="M640 300 600 380" stroke-width="2" marker-end="url(#cnx-arrow)"/>
      <path d="M880 370 930 470" stroke-width="2" marker-end="url(#cnx-arrow)"/>
      <path d="M850 270 960 250" stroke-width="1.6" stroke-dasharray="7 7" opacity="0.75" marker-end="url(#cnx-arrow)"/>
      <path d="M660 430 700 500" stroke-width="1.6" stroke-dasharray="7 7" opacity="0.75" marker-end="url(#cnx-arrow)"/>
    </g>

    <g fill="#2563EB" stroke="#0F172A" stroke-width="2.5">
      <circle cx="760" cy="360" r="14" filter="url(#cnx-glow)"/>
      <circle cx="640" cy="300" r="8"/>
      <circle cx="660" cy="430" r="9"/>
      <circle cx="850" cy="270" r="7"/>
      <circle cx="880" cy="370" r="10"/>
      <circle cx="830" cy="470" r="8"/>
      <circle cx="600" cy="380" r="6"/>
    </g>
    <g fill="#60A5FA" stroke="#0F172A" stroke-width="2">
      <circle cx="930" cy="470" r="6"/>
      <circle cx="980" cy="330" r="7"/>
      <circle cx="700" cy="500" r="6"/>
      <circle cx="960" cy="250" r="5"/>
      <circle cx="760" cy="220" r="6"/>
    </g>
    <g fill="#F1F5F9" font-size="14" font-weight="500">
      <text x="650" y="284">engine.ts</text>
      <text x="892" y="360">index.ts</text>
      <text x="774" y="362">App.tsx</text>
    </g>
    <g fill="#94A3B8" font-size="13">
      <text x="624" y="318">router.ts</text>
      <text x="848" y="492">theme.css</text>
      <text x="986" y="318">docs/</text>
    </g>

    <g transform="translate(80 520)">
      <line x1="0" y1="0" x2="44" y2="0" stroke="#94A3B8" stroke-width="2" marker-end="url(#cnx-arrow)"/>
      <text x="58" y="5" fill="#CBD5E1" font-size="15">imports &amp; requires</text>
      <line x1="240" y1="0" x2="284" y2="0" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="7 7"/>
      <text x="298" y="5" fill="#CBD5E1" font-size="15">documentation links</text>
      <line x1="0" y1="34" x2="44" y2="34" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
      <text x="58" y="39" fill="#CBD5E1" font-size="15">click a neuron to open its code in the sidebar</text>
    </g>

    <text x="80" y="596" fill="#64748B" font-size="14">dsh-connectome · DSH plugin · canvas + d3-force · illustration, not a screenshot</text>
  </g>
</svg>
